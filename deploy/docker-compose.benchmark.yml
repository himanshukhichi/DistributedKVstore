services:
  node-1:
    image: distkv-benchmark:latest
    container_name: distkv-bench-node-1
    environment:
      DISTKV_NODE_ID: node-1
      DISTKV_HOST: node-1
      DISTKV_PORT: 50051
      DISTKV_METRICS_PORT: 9100
      DISTKV_DATA_DIR: /data/node-1
      DISTKV_REPLICATION_FACTOR: 3
      DISTKV_PEERS: node-2:node-2:50051,node-3:node-3:50051,node-4:node-4:50051,node-5:node-5:50051
      DISTKV_WAL_COMPACTION_WRITES: 100000000
      DISTKV_ANTI_ENTROPY_INTERVAL_SECONDS: 3600
      DISTKV_BLOOM_EXPECTED_INSERTIONS: 5000000
    ports:
      - "51051:50051"
      - "9201:9100"
    tmpfs:
      - /data:size=1g

